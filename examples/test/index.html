<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synapse — Visual Test Suite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
    }
    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: default;
    }
    #debug-panel {
      position: fixed;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 8px;
      font-size: 12px;
      font-family: monospace;
      min-width: 250px;
      border: 1px solid #333;
    }
    #debug-panel h3 {
      margin-bottom: 10px;
      color: #e94560;
      font-size: 14px;
    }
    .debug-row {
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
    }
    .debug-label { color: #888; }
    .debug-value { color: #4ecdc4; font-weight: bold; }
    .debug-value.hit { color: #4ecdc4; }
    .debug-value.miss { color: #666; }
    #test-controls {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.8);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    #test-controls h3 {
      margin-bottom: 10px;
      color: #e94560;
      font-size: 14px;
    }
    .test-btn {
      display: block;
      margin: 5px 0;
      padding: 8px 15px;
      background: #16213e;
      color: #eee;
      border: 1px solid #0f3460;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      width: 100%;
      text-align: left;
    }
    .test-btn:hover { background: #0f3460; }
    .test-btn:active { background: #e94560; }
    #hit-indicator {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: rgba(233, 69, 96, 0.5);
      border: 2px solid #e94560;
      pointer-events: none;
      display: none;
      transform: translate(-50%, -50%);
    }
    #hit-indicator.active { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="debug-panel">
    <h3>Debug Info</h3>
    <div class="debug-row">
      <span class="debug-label">Central Node:</span>
      <span class="debug-value" id="central-node">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Pointer Position:</span>
      <span class="debug-value" id="pointer-pos">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Hit Test:</span>
      <span class="debug-value" id="hit-test">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Hovered Node:</span>
      <span class="debug-value" id="hovered-node">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Hovered Curve:</span>
      <span class="debug-value" id="hovered-curve">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Total Nodes:</span>
      <span class="debug-value" id="total-nodes">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Visible Nodes:</span>
      <span class="debug-value" id="visible-nodes">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">Total Edges:</span>
      <span class="debug-value" id="total-edges">-</span>
    </div>
    <div class="debug-row">
      <span class="debug-label">FPS:</span>
      <span class="debug-value" id="fps">-</span>
    </div>
  </div>
  <div id="test-controls">
    <h3>Test Controls</h3>
    <button class="test-btn" id="btn-navigate-a">Navigate to A</button>
    <button class="test-btn" id="btn-navigate-b">Navigate to B</button>
    <button class="test-btn" id="btn-navigate-c">Navigate to C</button>
    <button class="test-btn" id="btn-navigate-d">Navigate to D</button>
    <button class="test-btn" id="btn-reset">Reset to B</button>
  </div>
  <div id="hit-indicator"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
