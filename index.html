<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synapse — Interactive Graph Visualization</title>
  <meta name="description" content="Canvas-based graph navigation tool for exploring relationships between entities. Activate a node and it animates to center with the graph re-laying out around it." />
  <meta property="og:title" content="Synapse — Interactive Graph Visualization" />
  <meta property="og:description" content="Canvas-based graph navigation tool for exploring relationships between entities." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231a1a2e' stroke='%23e94560' stroke-width='2'/%3E%3Ccircle cx='16' cy='12' r='4' fill='%23e94560'/%3E%3Ccircle cx='10' cy='22' r='3' fill='%23533483'/%3E%3Ccircle cx='22' cy='22' r='3' fill='%23533483'/%3E%3Cpath d='M16 16 L10 20 M16 16 L22 20' stroke='%23533483' stroke-width='1.5'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>
    <aside id="panel" aria-label="Graph controls">
      <div class="panel-section">
        <label for="search">Search graph</label>
        <input id="search" type="search" placeholder="Try Kant, stoic, modern..." autocomplete="off" />
        <div id="results" class="results" aria-live="polite"></div>
      </div>
      <div class="panel-section actions">
        <button id="back" type="button" disabled>Back</button>
        <button id="forward" type="button" disabled>Forward</button>
      </div>
      <div class="panel-section">
        <p id="status">Activate a node or curve to navigate.</p>
        <p id="details"></p>
      </div>
      <div class="panel-section shortcuts">
        <p><kbd>/</kbd> search <kbd>Esc</kbd> clear</p>
        <p><kbd>←</kbd><kbd>→</kbd> incoming/outgoing <kbd>↑</kbd><kbd>↓</kbd> peers</p>
        <p><kbd>[</kbd><kbd>]</kbd> history</p>
      </div>
    </aside>
  </div>
  <script type="module" src="/examples/philosophy/main.ts"></script>
</body>
</html>
